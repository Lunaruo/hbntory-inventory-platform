<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HBntory — Assistant Produits & Stock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-dark: #08090c;
    --bg-panel: #12141a;
    --bg-card: #1a1d26;
    --accent: #F3217C;
    --accent-2: #7B2FF7;
    --accent-soft: rgba(243, 33, 124, 0.14);
    --text-primary: #f5f5f7;
    --text-secondary: #8e8fa0;
    --text-tertiary: #5c5d6b;
    --border: rgba(255, 255, 255, 0.07);
    --success: #2ecc71;
  }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background:
      radial-gradient(ellipse 900px 600px at 15% -10%, rgba(123,47,247,0.18) 0%, transparent 60%),
      radial-gradient(ellipse 900px 700px at 100% 100%, rgba(243,33,124,0.14) 0%, transparent 55%),
      var(--bg-dark);
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
  }

  .app {
    width: 100%;
    max-width: 740px;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 40px 100px rgba(0,0,0,0.55), 0 1px 0 rgba(255,255,255,0.04) inset;
    display: flex;
    flex-direction: column;
    height: 84vh;
    max-height: 800px;
  }

  .header {
    display: flex;
    align-items: center;
    gap: 15px;
    padding: 22px 26px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, rgba(255,255,255,0.02), transparent);
  }

  .logo {
    width: 46px;
    height: 46px;
    border-radius: 14px;
    background: linear-gradient(140deg, var(--accent), var(--accent-2));
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 17px;
    letter-spacing: -0.3px;
    flex-shrink: 0;
    box-shadow: 0 6px 18px rgba(243,33,124,0.35);
  }

  .header-text h1 {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -0.2px;
  }

  .header-text p {
    font-size: 12.5px;
    color: var(--text-secondary);
    margin-top: 3px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--success);
    box-shadow: 0 0 0 3px rgba(46,204,113,0.18);
    display: inline-block;
  }

  .header-badge {
    margin-left: auto;
    font-size: 11px;
    font-weight: 500;
    color: var(--text-secondary);
    background: var(--bg-card);
    border: 1px solid var(--border);
    padding: 6px 12px;
    border-radius: 999px;
  }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 28px 26px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .messages::-webkit-scrollbar { width: 5px; }
  .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

  .row {
    display: flex;
    gap: 10px;
    align-items: flex-end;
    animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .row.user { flex-direction: row-reverse; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .avatar {
    width: 28px;
    height: 28px;
    border-radius: 9px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 600;
  }

  .avatar.bot { background: linear-gradient(140deg, var(--accent), var(--accent-2)); }
  .avatar.user { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-secondary); }

  .msg {
    max-width: 74%;
    padding: 13px 17px;
    border-radius: 18px;
    font-size: 14.5px;
    line-height: 1.6;
    letter-spacing: -0.1px;
  }

  .msg.user {
    background: linear-gradient(135deg, var(--accent), #d81b6c);
    color: white;
    border-bottom-right-radius: 5px;
  }

  .msg.bot {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-bottom-left-radius: 5px;
  }

  .msg.bot.error {
    border-color: rgba(226,75,74,0.35);
    background: rgba(226,75,74,0.06);
    color: #f0a3a3;
  }

  .typing-row .msg { display: flex; gap: 5px; padding: 15px 19px; }

  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--text-tertiary);
    animation: bounce 1.2s infinite ease-in-out;
  }
  .dot:nth-child(2) { animation-delay: 0.15s; }
  .dot:nth-child(3) { animation-delay: 0.3s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  .suggestions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 0 26px 18px;
  }

  .chip {
    font-size: 12.5px;
    font-weight: 500;
    color: var(--text-secondary);
    background: var(--bg-card);
    border: 1px solid var(--border);
    padding: 8px 15px;
    border-radius: 999px;
    cursor: pointer;
    transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
    white-space: nowrap;
  }

  .chip:hover {
    border-color: var(--accent);
    color: var(--text-primary);
    background: var(--accent-soft);
    transform: translateY(-1px);
  }

  .input-bar {
    display: flex;
    gap: 10px;
    padding: 18px 22px 22px;
    border-top: 1px solid var(--border);
    background: linear-gradient(0deg, rgba(255,255,255,0.015), transparent);
  }

  .input-bar input {
    flex: 1;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 18px;
    color: var(--text-primary);
    font-size: 14.5px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  .input-bar input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(243,33,124,0.12);
  }

  .input-bar input::placeholder { color: var(--text-tertiary); }

  .send-btn {
    width: 50px;
    height: 50px;
    border-radius: 14px;
    border: none;
    background: linear-gradient(140deg, var(--accent), var(--accent-2));
    color: white;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.12s ease, box-shadow 0.15s ease;
    flex-shrink: 0;
    box-shadow: 0 6px 16px rgba(243,33,124,0.3);
  }

  .send-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(243,33,124,0.4); }
  .send-btn:active { transform: scale(0.93); }
  .send-btn:disabled { opacity: 0.4; cursor: default; transform: none; box-shadow: none; }
  .send-btn svg { width: 18px; height: 18px; }
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <div class="logo">HB</div>
    <div class="header-text">
      <h1>HBntory Assistant</h1>
      <p><span class="status-dot"></span>En ligne</p>
    </div>
    <div class="header-badge">Produits & Stock</div>
  </div>

  <div class="messages" id="messages">
    <div class="row bot">
      <div class="avatar bot">HB</div>
      <div class="msg bot">
        Bonjour ! Je peux vous renseigner sur nos produits et leur disponibilité en stock. Que souhaitez-vous savoir ?
      </div>
    </div>
  </div>

  <div class="suggestions" id="suggestions">
    <div class="chip" onclick="askSuggestion(this)">Détails du produit HB-LAP-1001</div>
    <div class="chip" onclick="askSuggestion(this)">Où trouver le HB-LAP-1001 ?</div>
    <div class="chip" onclick="askSuggestion(this)">Quels produits sont disponibles ?</div>
  </div>

  <form class="input-bar" id="form">
    <input type="text" id="question" placeholder="Écrivez votre question ici..." autocomplete="off" />
    <button type="submit" class="send-btn" id="sendBtn" aria-label="Envoyer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
    </button>
  </form>
</div>

<script>
  const API_URL = "http://localhost:8000/ask";

  const messagesEl = document.getElementById("messages");
  const form = document.getElementById("form");
  const input = document.getElementById("question");
  const sendBtn = document.getElementById("sendBtn");
  const suggestions = document.getElementById("suggestions");

  function addMessage(text, sender, isError) {
    const row = document.createElement("div");
    row.className = "row " + sender;

    const avatar = document.createElement("div");
    avatar.className = "avatar " + sender;
    avatar.textContent = sender === "bot" ? "HB" : "Moi";
    if (sender === "user") avatar.style.fontSize = "10px";

    const msg = document.createElement("div");
    msg.className = "msg " + sender + (isError ? " error" : "");
    msg.textContent = text;

    row.appendChild(avatar);
    row.appendChild(msg);
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function showTyping() {
    const row = document.createElement("div");
    row.className = "row bot typing-row";
    row.id = "typing-indicator";
    row.innerHTML =
      "<div class='avatar bot'>HB</div>" +
      "<div class='msg bot'><span class='dot'></span><span class='dot'></span><span class='dot'></span></div>";
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function hideTyping() {
    const el = document.getElementById("typing-indicator");
    if (el) el.remove();
  }

  async function sendQuestion(question) {
    addMessage(question, "user");
    input.value = "";
    sendBtn.disabled = true;
    if (suggestions) suggestions.style.display = "none";
    showTyping();

    try {
      const response = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question: question }),
      });

      if (!response.ok) {
        throw new Error("Le service a répondu avec une erreur (" + response.status + ").");
      }

      const data = await response.json();
      hideTyping();
      addMessage(data.answer, "bot", data.success === false);
    } catch (err) {
      hideTyping();
      addMessage(
        "Impossible de contacter l'assistant. Vérifiez que le service est bien lancé.",
        "bot",
        true
      );
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    const question = input.value.trim();
    if (!question) return;
    sendQuestion(question);
  });

  function askSuggestion(el) {
    sendQuestion(el.textContent);
  }
</script>

</body>
</html>
