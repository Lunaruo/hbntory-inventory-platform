{% extends "base.html" %}
{% block title %}
{{ "Edit User" if user else "Create User" }}
{% endblock %}
{% block content %}
<h2>{{ "Edit User" if user else "Create User" }}</h2>
<form method="POST">
    <label>Username</label>
    <br>
    <input type="text" name="username"
           value="{{ user.username if user else '' }}" required>
    <br><br>

    {% if not user %}
    <label>Password</label>
    <br>
    <input type="password" name="password" required>
    <br><br>
    {% endif %}

    <label>Role</label>
    <br>
    <select name="role">
        <option value="admin" {{ "selected" if user and user.role == "admin" }}>
            Admin
        </option>
        <option value="user" {{ "selected" if user and user.role == "user" }}>
            Common User
        </option>
    </select>
    <br><br>

    <label>Branch</label>
    <br>
    <select name="branch_id">
        <option value="">None</option>
        {% for branch in branches %}
        <option value="{{ branch.id }}"
            {{ "selected" if user and user.branch_id == branch.id }}>
            {{ branch.name }}
        </option>
        {% endfor %}
    </select>
    <br><br>

    <button type="submit">Save</button>
</form>

{% if user %}
<hr>
<h3>Change password</h3>
<form method="POST" action="{{ url_for('users.change_password', user_id=user.id) }}">
    <input type="password" name="password" placeholder="New password" required>
    <button type="submit">Update password</button>
</form>
{% endif %}
{% endblock %}
